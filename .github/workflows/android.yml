name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug
        find . -name '*.apk'
#./app/build/outputs/apk/prepaid/debug/sms-messenger-prepaid-debug.apk
#./app/build/outputs/apk/core/debug/sms-messenger-core-debug.apk
#./app/build/outputs/apk/fdroid/debug/sms-messenger-fdroid-debug.apk

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        path: ./app/build/outputs/apk/core/debug/sms-messenger-core-debug.apk
